apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eks-platform-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/kamaldeepsingh039/aws-eks-platform-engineering.git
    targetRevision: main
    path: argocd
    directory:
      exclude: root-app.yaml

  destination:
    server:  https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true