apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: eks-platform
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.14.0 
      helm:
        releaseName: external-secrets
        valueFiles:
          - $values/helm/external-secrets/values.yaml
    - repoURL: https://github.com/kamaldeepsingh039/aws-eks-platform-engineering.git
      targetRevision: main
      ref: values
  destination: 
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true


---


apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reloader
  namespace: argocd
spec:
  project: eks-platform
  sources:
    - repoURL: https://stakater.github.io/stakater-charts
      chart: reloader
      targetRevision: 2.2.19
      helm:
        releaseName: reloader
        valueFiles:
          - $values/helm/reloader/values.yaml
    - repoURL: https://github.com/kamaldeepsingh039/aws-eks-platform-engineering.git
      targetRevision: main
      ref: values
  destination: 
    server: https://kubernetes.default.svc
    namespace: reloader
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true    

