apiVersion: apps/v1
kind: Deployment
metadata:
   name: flask-app
   namespace: backend
   labels:
     app: flask-app
   annotations:
     secret.reloader.stakater.com/reload: "flask-db-credentials"
spec:
  replicas: 2
  selector:
    matchLabels:
       app: flask-app
  template:
     metadata:
       labels:
          app: flask-app
     spec:
       containers:
         - name: flask-app
           image: 082139776123.dkr.ecr.ca-central-1.amazonaws.com/eks-flask-app:v3
           env:
             - name: DB_HOST
               value: "${RDS_ENDPOINT}"
             - name: DB_PORT
               value: "5432"
             - name: DB_NAME
               value: "postgres"
             - name: DB_SSLMODE
               value: "require"
             - name: DB_USER
               valueFrom:
                 secretKeyRef:
                   name: flask-db-credentials
                   key: DB_USER

             - name: DB_PASSWORD
               valueFrom:
                 secretKeyRef:
                   name: flask-db-credentials
                   key: DB_PASSWORD
                   
           ports:
            - containerPort: 5000
           resources:
             requests:
               memory: "128Mi"
               cpu: "100m"
             limits:
               memory: "256Mi"
               cpu: "250m"
           readinessProbe:
             httpGet:
               path: /health
               port: 5000
             initialDelaySeconds: 5
             periodSeconds: 10
           livenessProbe:
             httpGet:
               path: /health
               port: 5000
             initialDelaySeconds: 15
             periodSeconds: 20
             failureThreshold: 3
           startupProbe:
             httpGet:
               path: /health
               port: 5000
             periodSeconds: 5
             failureThreshold: 12
