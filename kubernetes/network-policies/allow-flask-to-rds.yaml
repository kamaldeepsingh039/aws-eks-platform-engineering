apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flask-to-rds
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app: flask-app
  policyTypes:
    - Egress
  egress:
    - to:
       - ipBlock:
          cidr: <database_network_CIDR>
      ports:
        - protocol: TCP
          port: 5432