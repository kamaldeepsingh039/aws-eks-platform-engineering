apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-flask-to-rds
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app: flask-app
  policyTypes:
    - Egress
  egress:
    - to:
       - ipBlock:
            cidr: 10.0.21.0/24
       - ipBlock:
            cidr: 10.0.22.0/24
      ports:
        - protocol: TCP
          port: 5432