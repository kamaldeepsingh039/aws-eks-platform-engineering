apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-to-flask
  namespace: backend
spec:
  podSelector:
    matchLabels:
      app: flask-app
  policyTypes:
    - Ingress
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.k8s.io/metadata.name: frontend
        podSelector:
          matchLabels:
            app: nginx-app
      ports:
        - protocol: TCP
          port: 5000
