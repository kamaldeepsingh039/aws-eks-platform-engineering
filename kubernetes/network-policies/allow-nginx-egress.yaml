apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-egress
  namespace: frontend
spec:
  podSelector:
    matchLabels:
      app: nginx-app
  policyTypes:
    - Egress
  egress:
    - to:
       - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: backend
         podSelector:
          matchLabels:
            app: flask-app
      ports:
       - protocol: TCP
         port: 5000
