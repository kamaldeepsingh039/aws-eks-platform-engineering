apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: frontend
data:
  default.conf: |
    server{
      listen 80;

       location / {
         proxy_pass http://flask-service.backend.svc.cluster.local:80;
       }

       location = /health{
    access_log off;
    return 200 "ok\n";
     }
    }
