apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: flask-db-credentials
  namespace: backend

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  
  target:
    name: flask-db-credentials
    creationPolicy: Owner

  data:
    - secretKey: DB_USER
      remoteRef:
        key: "arn:aws:secretsmanager:ca-central-1:082139776123:secret:rds!db-27d7756e-f2be-4bca-88f3-9dea0107a8fa-n4PndG"
        property: username

    - secretKey: DB_PASSWORD
      remoteRef: 
        key: "arn:aws:secretsmanager:ca-central-1:082139776123:secret:rds!db-27d7756e-f2be-4bca-88f3-9dea0107a8fa-n4PndG"
        property: password
