apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: flask-db-credentials
  namespace: backend

spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  
  target:
    name: flask-db-credentials
    creationPolicy: Owner

  data:
    - secretKey: DB_USER
      remoteRef:
        key: ${RDS_SECRET_ARN}
        property: username

    - secretKey: DB_PASSWORD
      remoteRef: 
        key: ${RDS_SECRET_ARN}
        property: password     